name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MAGO_VERSION: "1.59.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install --group dev .
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy

  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, python: "3.10" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, python: "3.11" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, python: "3.12" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, python: "3.13" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, python: "3.14" }
          - { os: macos-latest, target: aarch64-apple-darwin, python: "3.10" }
          - { os: macos-latest, target: aarch64-apple-darwin, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install mago
        run: |
          name="mago-$MAGO_VERSION-${{ matrix.target }}"
          curl -sSfL "https://github.com/carthage-software/mago/releases/download/$MAGO_VERSION/$name.tar.gz" | tar xz
          echo "$PWD/$name" >> "$GITHUB_PATH"
      - run: pip install --group dev .
      - run: mago --version
      # The integration tests skip themselves without mago; make sure they really ran here.
      - run: python -m pytest -rs | tee pytest.log && ! grep -q SKIPPED pytest.log

  pre-commit:
    # Installs the hooks the way users do, through pre-commit and this repository's manifest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install mago and pre-commit
        run: |
          name="mago-$MAGO_VERSION-x86_64-unknown-linux-gnu"
          curl -sSfL "https://github.com/carthage-software/mago/releases/download/$MAGO_VERSION/$name.tar.gz" | tar xz -C /tmp
          echo "/tmp/$name" >> "$GITHUB_PATH"
          pip install pre-commit
      - name: Commit through the hooks
        run: |
          set -eu
          git config --global user.email ci@example.com
          git config --global user.name ci
          mkdir -p /tmp/target/src && cd /tmp/target
          git init -q -b main
          printf '[source]\npaths = ["src"]\n' > mago.toml
          cat > .pre-commit-config.yaml <<EOF
          repos:
            - repo: $GITHUB_WORKSPACE
              rev: $GITHUB_SHA
              hooks:
                - id: mago-format
                - id: mago-lint
                - id: mago-analyze
          EOF
          pre-commit install
          printf '<?php\n\ndeclare(strict_types=1);\n\nfunction answer(): int\n{\n    return 42;\n}\n' > src/good.php
          git add . && git commit -q -m "Add good file"
          printf '<?php\n\ndeclare(strict_types=1);\n\nfunction wrong(): int\n{\n    return "x";\n}\n' > src/bad.php
          git add src/bad.php
          if git commit -q -m "Add bad file"; then echo "commit with a type error must fail"; exit 1; fi
          test "$(git log --format=%s)" = "Add good file"
